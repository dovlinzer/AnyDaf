<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Public+Sans:wght@400;500;600&family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@400;600;700&display=swap">
<style>
:root{--ground:#F4F5F9;--panel:#FFFFFF;--ink:#1A1F2E;--muted:#5B6478;--line:#DCE0EA;--blue:#1B3A8A;--teal:#2C6A6E;--teal-line:#B9D3D4;--amber:#9A6212;--amber-soft:#FBF1DF;--grey-soft:#EEF0F4;--link:#6B4FA0;--term:#E4EAF8;--current:#1B3A8A;--range:#EAF0FB;--range-edge:#1B3A8A;--shadow:0 12px 40px rgba(20,30,60,.18);--audio-bg:#E6EEFC;--audio-line:#C5D4F2;--l2:#3A62A8;--gem-bg:#F8F6F1;
--serif:"Newsreader",Georgia,"Times New Roman",serif;--sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--hebrew:"Frank Ruhl Libre","Times New Roman",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--ground:#10131B;--panel:#181C27;--ink:#E6E9F2;--muted:#9AA3B8;--line:#2B3142;--blue:#8FA8EC;--teal:#7CC3C4;--teal-line:#2F4B4E;--amber:#E0B067;--amber-soft:#33291A;--grey-soft:#222735;--link:#B9A2E6;--term:#26314F;--current:#8FA8EC;--range:#1D2640;--range-edge:#8FA8EC;--shadow:0 12px 40px rgba(0,0,0,.5);--ok:#7CC48A;--no:#EE8F8F;--audio-bg:#1A2744;--l2:#A6C2EE;--gem-bg:#1B1E26;--audio-line:#2C3D63}}
:root[data-theme="dark"]{color-scheme:dark;--ok:#7CC48A;--no:#EE8F8F;--ground:#10131B;--panel:#181C27;--ink:#E6E9F2;--muted:#9AA3B8;--line:#2B3142;--blue:#8FA8EC;--teal:#7CC3C4;--teal-line:#2F4B4E;--amber:#E0B067;--amber-soft:#33291A;--grey-soft:#222735;--link:#B9A2E6;--term:#26314F;--current:#8FA8EC;--range:#1D2640;--range-edge:#8FA8EC;--shadow:0 12px 40px rgba(0,0,0,.5);--audio-bg:#1A2744;--l2:#A6C2EE;--gem-bg:#1B1E26;--audio-line:#2C3D63}
html,body{height:100%}
/* the height Safari actually shows, toolbars and all, so the audio bar at the foot isn't hidden under them */
@supports (height:100dvh){body{height:100dvh}}
/* the base rules claude.ai adds to every page, repeated here so the page also works on its own (Vercel) */
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
body{background:var(--ground);color:var(--ink);font:15px/1.55 var(--sans);display:flex;flex-direction:column;overflow:hidden}
__RENDERER_CSS__
__GAMES_CSS__
__MEASURES_CSS__

/* the sages relationship box (shared kit): its rules read --card, --fg and --blue */
.sgx{--card:var(--panel);--fg:var(--ink);--blue:var(--accent,#1b3a8a)}
#swinAll{margin-inline-start:auto;margin-top:0;width:auto;height:auto;white-space:nowrap;line-height:1.5}
.sage .relbtn,#swinAll{font:inherit;font-size:13px;border:1px solid var(--accent,#1b3a8a);background:none;color:var(--accent,#1b3a8a);border-radius:12px;padding:1px 10px;cursor:pointer;margin-top:4px}
/* The Reference popup (weights, measures, money) from Illustrated Mishna: its rules read --card and
   --fg; the button sits in the bar beside the gear instead of floating over a header */
.mpop{--card:var(--panel);--fg:var(--ink);z-index:62;box-sizing:border-box}
.mpop .mtabs button.on,.mpop .mvf button.on{color:var(--panel)}
.bar .refbtn{position:static;width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--panel);box-shadow:none;color:var(--muted)}
.bar .refbtn:hover{color:var(--blue);border-color:var(--blue)}
/* the sages button: the author's icon (brand/sage-icon.png), drawn in the button's colour */
.sageico{display:block;width:22px;height:22px;background:currentColor;-webkit-mask:url(brand/sage-icon.png) center/contain no-repeat;mask:url(brand/sage-icon.png) center/contain no-repeat}
.mu:hover,.mu:focus-visible{border-bottom-style:solid}
#pwin{width:min(640px,calc(100vw - 32px));height:min(640px,calc(100% - 120px));inset-inline-end:72px;top:96px}
#pwin .adg{flex:1}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar h1{font:600 1.25rem/1.2 var(--serif);margin:0;margin-inline-end:8px;white-space:nowrap}
.bar h1.brand{display:flex;align-items:center;gap:10px;margin-inline-end:4px}
.bar h1.brand a{display:flex;line-height:0}
.bar h1.brand img{height:40px;width:auto}
.bar h1.brand .bt{font:600 1.2rem/1.1 var(--serif);color:var(--blue);white-space:nowrap}
.lg-w{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg-c{display:none}:root:not([data-theme="light"]) .lg-w{display:inline}}
:root[data-theme="dark"] .lg-c{display:none}:root[data-theme="dark"] .lg-w{display:inline}
.bar h1 small{font:500 12px var(--sans);color:var(--muted);margin-inline-start:8px;letter-spacing:.02em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--ground);padding:2px}
.seg button{font:500 12.5px var(--sans);border:0;background:none;color:var(--muted);padding:5px 11px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--panel)}
.tog{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);cursor:pointer}
.tog input{accent-color:var(--blue)}
.btn{font:500 12.5px var(--sans);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--panel)}
/* Contents sits above its column: far left by default, far right when the sides are swapped;
   hidden where the column itself doesn't show. */
@media (max-width:1099px){#railBtn{display:none}}
.spacer{flex:1}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* Column widths come from --gemw (the text side, % of the page) and --railw (the contents
   column), both set by dragging the dividers. */
.main{--gemw:40%;--railw:230px;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--gemw)}
.main.textleft{grid-template-columns:var(--gemw) minmax(0,1fr)}
.main.textleft .gem{order:-1;border-inline-start:0;border-inline-end:1px solid var(--line)}
/* "At a glance" in its own column on wide screens, so it stays in view; inline at the top of the
   outline otherwise. It sits on the outline's outer side, whichever side the text pane is on. */
.railp{display:none;overflow-y:auto;min-height:0;border-inline-end:1px solid var(--line);background:var(--panel);padding:14px 12px 30px;overscroll-behavior:contain}
@media (min-width:1100px){
 .main.rail{grid-template-columns:var(--railw) minmax(0,1fr) var(--gemw)}
 .main.rail.textleft{grid-template-columns:var(--gemw) minmax(0,1fr) var(--railw)}
 .main.rail .railp{display:block}
 .main.rail.textleft .railp{order:1;border-inline-end:0;border-inline-start:1px solid var(--line)}
 .main.rail #outline .ado-glance{display:none}
}
.pane{overflow-y:auto;min-height:0;overscroll-behavior:contain;position:relative}
.out{padding:18px 28px 40vh}
.terms{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.terms .lbl{font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-inline-end:4px}
.terms button{font:500 13px var(--sans);background:var(--term);color:var(--ink);border:0;border-radius:999px;padding:3px 10px;cursor:pointer}
.terms button span{font-family:var(--hebrew);margin-inline-start:6px;color:var(--muted)}
#outZoom[dir="rtl"] .terms .lbl{margin:0 0 0 4px;letter-spacing:0;font-size:12.5px}
#outZoom[dir="rtl"] .terms button{font:500 14px "Assistant","Arial Hebrew",Arial,sans-serif}
.gem{border-inline-start:1px solid var(--line);background:var(--gem-bg);display:flex;flex-direction:column;min-height:0}
.gemhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
.now{flex-basis:100%;font-size:12.5px;color:var(--muted);min-height:1.4em}
.now b{color:var(--ink);font-weight:600}
.now code{font:500 11.5px var(--sans);font-variant-numeric:tabular-nums;color:var(--blue)}
.text{padding:8px 18px 40vh}
.item{display:grid;grid-template-columns:minmax(0,1fr);gap:0 10px;padding:10px 8px;border-radius:6px;cursor:pointer;border-inline-start:3px solid transparent;scroll-margin-top:8px}
.item:hover{background:var(--grey-soft)}
.item.in{background:var(--range);border-inline-start-color:var(--range-edge)}
.item.ctx{opacity:.55}
.item .lab,.quote .q-lab{display:none}
.item .he{font:400 1.12rem/1.75 var(--hebrew);direction:rtl;text-align:right;margin:0}
.item .en{margin:4px 0 0;font-size:14px;color:var(--muted)}
.item .en b{color:var(--ink);font-weight:600}
.item .note{font:600 10.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.gem[data-lang="he"] .en,.gem[data-lang="en"] .he,.gem[data-lang="he"] .q-en,.gem[data-lang="en"] .q-he{display:none}
.gem[data-lang="en"] .en{margin-top:0}
/* Vilna margin references (Ein Mishpat = halakha, Mesoret HaShas = Shas, verses), on Gemara lines and shiur quotes.
   Under the line: one small pill per kind, opening its list. In the margin: the sources listed beside the line, as in
   the Vilna page. Colors by kind. A narrow pane always uses the pills. */
#textPane,#shiurPane{container-type:inline-size}
.xc{--k:var(--l2)}.xc.ms{--k:var(--amber)}.xc.v{--k:var(--link)}
.xchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-top:6px;grid-column:-2/-1}
.xb{font:600 11.5px var(--sans);color:var(--k);background:none;border:1px solid color-mix(in srgb,var(--k) 45%,transparent);border-radius:999px;padding:1px 9px;cursor:pointer}
.xb:hover,.xb[aria-expanded="true"]{background:color-mix(in srgb,var(--k) 12%,transparent);border-color:var(--k)}
.xrl{cursor:auto;margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-inline-start:3px solid var(--k);border-radius:6px;background:var(--panel);font:13px/1.5 var(--sans);display:grid;gap:5px;grid-column:-2/-1}
.xrl .xn{display:grid;gap:0}
.xrl .xn .xmark{margin-bottom:2px}
.xwr+.xwr{border-top:1px solid var(--line);margin-top:3px;padding-top:3px}
#pageMg .xwr+.xwr{border-top:0;padding-top:0;margin-top:4px}   /* daf panel: space, no line, between Rambam and SA */
.xwn{font-weight:600;color:var(--blue)}
.xrl .xwr a{color:var(--k)}
.xrl .xmark,.xmg .xmark,#pageMg .xmark{unicode-bidi:isolate}
.xlt{font:700 14px var(--hebrew);color:var(--k)}
.xw{font:400 14px var(--hebrew);color:var(--muted)}
.xrl a,.xmg a,#pageMg a{color:var(--ink);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--k) 45%,transparent);text-underline-offset:2px}
.xrl a:hover,.xmg a:hover,#pageMg a:hover{text-decoration-color:var(--k)}
/* In the margin: a dedicated, narrow column down the right of the pane, ruled off; a line's sources sit beside it, one
   kind to a line, the links in the kind's color. xrFit() gives a line room when its sources run longer than its text.
   The margin can be folded away (an arrow at the pane's top right); folded, small dots mark the lines with sources. */
.xmg{display:none;cursor:auto;font:11.5px/1.35 var(--sans);overflow-wrap:anywhere}
.xmg .xc,#pageMg .xc{display:block;margin-bottom:4px}
.xmg .xc a,#pageMg .xc a{color:var(--k);text-decoration:none}
.xmg .xwn,#pageMg .xwn{color:var(--blue);font-weight:600}
.xmg .xn,#pageMg .xn{display:block}
.xmg .xn>a,#pageMg .xn>a{display:block}
.xmg .xn+.xn,#pageMg .xn+.xn{margin-top:5px}
.xmg .xc a:hover,#pageMg .xc a:hover{text-decoration:underline}
.xmg .xlt,#pageMg .xlt{font-size:12.5px}
.xtick{display:none;position:absolute;top:14px;right:-15px;gap:2px;flex-direction:column;cursor:pointer;padding:2px}
.xtick i{width:5px;height:5px;border-radius:50%;background:var(--k);display:block}
.xmtog{display:none;position:sticky;top:6px;height:0;z-index:3}
.xmtog button{position:absolute;right:4px;top:0;width:24px;height:24px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--muted);font:600 14px/1 var(--sans);cursor:pointer;padding:0}
.xmtog button:hover{color:var(--blue);border-color:var(--blue)}
body.xr-margin .xmtog{display:block}
body.xr-margin .item,body.xr-margin .quote{position:relative}
body.xr-margin:not(.xr-shut) #text,body.xr-margin:not(.xr-shut) #shiur{padding-right:6.4rem;background-image:linear-gradient(var(--line),var(--line));background-repeat:no-repeat;background-size:1px 100%;background-position:right 6rem top}
body.xr-margin:not(.xr-shut) .xmg{display:block;position:absolute;top:10px;right:-5.75rem;width:5.3rem;text-align:left}
body.xr-margin.xr-shut #text,body.xr-margin.xr-shut #shiur{padding-right:30px}
body.xr-margin.xr-shut .xtick{display:flex}
body.xr-margin .xchips,body.xr-margin .xrl{display:none}
@container (max-width:540px){
 body.xr-margin #text,body.xr-margin #shiur{padding-right:18px!important;background-image:none!important}
 body.xr-margin .xmg,body.xr-margin .xtick,body.xr-margin .xmtog{display:none!important}
 body.xr-margin .xchips{display:flex}body.xr-margin .xrl:not([hidden]){display:grid}}
body.xr-off .xchips,body.xr-off .xrl,body.xr-off .xmg{display:none!important}
.item.xflash,.quote.xflash{background:var(--range)}
/* the source window (as on the YCT Torah Library site) */
.xsrc{width:min(640px,calc(100vw - 2rem));max-height:min(78vh,720px);padding:0;border:0;border-radius:12px;box-shadow:var(--shadow);color:var(--ink);background:var(--panel);overflow:hidden;display:none;flex-direction:column}
.xsrc[open]{display:flex}
.xsrc::backdrop{background:rgba(10,12,40,.45)}
.xsrc-head{display:flex;align-items:flex-start;gap:12px;padding:14px 16px 12px;background:var(--blue);color:var(--panel)}
.xsrc-titles{flex:1;min-width:0}
.xsrc-title{margin:0;font:700 1.05rem/1.3 var(--sans)}
.xsrc-he{margin-top:2px;font:400 1rem var(--hebrew);opacity:.85}
.xsrc-modes{display:flex;gap:2px;padding:3px;border-radius:6px;background:color-mix(in srgb,var(--panel) 18%,transparent);flex-shrink:0}
.xsrc-modes button{min-width:34px;padding:4px 8px;border:0;border-radius:4px;background:transparent;color:var(--panel);font:700 .8rem var(--sans);cursor:pointer}
.xsrc-modes button[aria-pressed="true"]{background:var(--panel);color:var(--blue)}
.xsrc-close{flex-shrink:0;width:32px;height:32px;margin:-4px -6px 0 0;border:0;border-radius:50%;background:transparent;color:var(--panel);font-size:1.5rem;line-height:1;cursor:pointer}
.xsrc-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 18px 12px;position:relative}
.xsrc-seg.hit{background:var(--range);border-inline-start:3px solid var(--range-edge);margin-inline:-18px;padding-inline:calc(2rem + 15px) 18px}
.xsrc-seg.hit .xsrc-num{inset-inline-start:15px}
/* Hebrew and Hebrew+English: the number in the right-hand column, beside the Hebrew; English: on the left */
.xsrc:not([data-mode="en"]) .xsrc-seg{padding:10px 2rem 10px 0}
.xsrc:not([data-mode="en"]) .xsrc-num{left:auto;right:0}
.xsrc:not([data-mode="en"]) .xsrc-seg.hit{padding:10px calc(2rem + 15px) 10px 18px;border-left:0;border-right:3px solid var(--range-edge)}
.xsrc:not([data-mode="en"]) .xsrc-seg.hit .xsrc-num{right:15px}
.xsrc[data-mode="en"] .xsrc-seg{padding:10px 0 10px 2rem}
.xsrc[data-mode="en"] .xsrc-num{left:0;right:auto}
.xsrc[data-mode="en"] .xsrc-seg.hit{padding:10px 18px 10px calc(2rem + 15px);border-right:0;border-left:3px solid var(--range-edge)}
.xsrc[data-mode="en"] .xsrc-seg.hit .xsrc-num{left:15px}
.xsrc-amud{font:600 .78rem var(--sans);color:var(--muted);letter-spacing:.04em;padding:12px 0 2px;border-bottom:1px solid var(--line)}
.xsrc-seg{position:relative;padding:10px 0 10px 2rem;border-bottom:1px solid var(--line)}
.xsrc-seg:last-child{border-bottom:0}
.xsrc-num{position:absolute;inset-inline-start:0;top:12px;font:700 .72rem var(--sans);color:var(--muted)}
.xsrc-seg .he{margin:0 0 6px;font:400 1.22rem/1.7 var(--hebrew);text-align:right;direction:rtl}
.xsrc-seg .en{margin:0;font-size:.97rem;line-height:1.6}
.xsrc-seg .en b,.xsrc-seg .en strong{color:var(--blue)}
.xsrc[data-mode="he"] .xsrc-seg .en,.xsrc[data-mode="en"] .xsrc-seg .he{display:none}
.xsrc-msg{margin:1.2rem 0;color:var(--muted)}
.xsrc-foot{display:flex;gap:16px;justify-content:flex-end;padding:9px 18px;border-top:1px solid var(--line);background:var(--ground)}
.xsrc-foot a,.xsrc-foot button{font:600 .85rem var(--sans);color:var(--blue);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.xsrc-foot a:hover,.xsrc-foot button:hover{text-decoration:underline}
@media (max-width:600px){.xsrc{width:100vw;max-width:100vw;max-height:85vh;margin:auto 0 0;border-radius:14px 14px 0 0}}
.item .hx{font:400 15px/1.7 "Assistant","Arial Hebrew",Arial,sans-serif;color:var(--ink);text-align:right;margin-top:6px}
.item .hx b{font-weight:700}
.credit[dir="rtl"]{text-align:right}
body.hemode #paneSeg [data-p="shiur"]{display:none}
body.hemode #langSeg{direction:rtl}
.seg.lang button{font-family:var(--hebrew),var(--sans);font-size:13.5px;min-width:2.4em}
.iconbtn{font:500 12.5px var(--sans);border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:5px 10px;border-radius:999px;cursor:pointer}
.shiur{padding:10px 22px 40vh;max-width:70ch}
.shiur h2{font:600 1.2rem/1.3 var(--serif);color:var(--blue);margin:26px 0 4px;text-wrap:balance}
.shiur h3{font:italic 500 1.05rem/1.35 var(--serif);margin:18px 0 4px;text-wrap:balance}
.shiur h3 em,.shiur h3 i{font-style:normal}
.shiur p{margin:8px 0}
.shiur hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.shiur .amudbreak{padding-inline:0}
.quote{margin:10px 0;padding:8px 12px;border-inline-start:3px solid var(--line);background:var(--ground);border-start-end-radius:6px;border-end-end-radius:6px;cursor:pointer}
.quote.in{border-inline-start-color:var(--range-edge);background:var(--range)}
.quote .q-he{font:400 1.08rem/1.75 var(--hebrew);direction:rtl;text-align:right;margin:4px 0}
.quote .q-en{font-size:14px;color:var(--muted);margin:2px 0 6px}
.quote .q-en b{color:var(--ink);font-weight:600}
.quote .q-lab{font:600 10.5px var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
.amudbreak{font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:18px 8px 6px;display:flex;gap:10px;align-items:center}
.amudbreak::after{content:"";flex:1;height:1px;background:var(--line)}
.page{padding:12px 14px 12px;display:flex;flex-direction:column;gap:10px;height:100%;box-sizing:border-box}
#pagePane{overflow:hidden}
.pagebar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.pagebar .folio{font:500 1.05rem var(--serif)}
html[lang="he"] .pagebar .folio{font-family:var(--hebrew)}
.amudnav{display:inline-flex;align-items:center;gap:4px}
/* previous / next daf at the top and foot of the Gemara and shiur */
.dafstep{display:flex;justify-content:center;margin:10px 0 18px}
.dafstep button{font:500 13px var(--sans);border:1px solid var(--line);background:var(--panel);color:var(--blue);border-radius:999px;padding:6px 14px;cursor:pointer}
.dafstep button:hover{border-color:var(--blue)}
.pageimg{flex:1;min-height:0;border:1px solid var(--line);border-radius:4px;overflow:auto;background:#FFF;overscroll-behavior:contain;touch-action:none}
.pageimg.pan{cursor:grab}.pageimg.pan.grabbing{cursor:grabbing}
.pageimg img{-webkit-user-drag:none;user-select:none;pointer-events:none}
.pagewrap{position:relative;width:calc(100% * var(--pz,1));box-sizing:border-box;padding-right:var(--xrw,18px)}
body.xr-off .pagewrap{--xrw:0px}
.pageimg img{display:block;width:100%;max-width:none;height:auto}
/* Live text: boxes from page_layout over the scan. The scan is always white, so these colors
   don't change in dark mode. Strokes stay one pixel whatever the zoom. */
.lay{position:absolute;inset:0 auto 0 0;width:calc(100% - var(--xrw,18px));height:100%;pointer-events:none;overflow:visible}
.lay rect{fill:transparent;stroke:none;vector-effect:non-scaling-stroke}
.lay .secp{fill:none;stroke:rgba(27,58,138,.6);stroke-width:1.5;stroke-linecap:square;vector-effect:non-scaling-stroke}   /* the outline's section: a border, no fill (author, 2026-11-08) */
body.textonly .lay .secp{display:none}
/* the Rashi/Tosafot beside the section are not marked (author: distracting); with no outline on screen,
   the section's border isn't drawn either */
.lay .hovp{fill:none;stroke:#1B3A8A;stroke-width:1.5;stroke-linecap:square;vector-effect:non-scaling-stroke}
.lay .hovp.c{stroke:#9A6212}
.lay .sel{fill:rgba(27,58,138,.3)}
.lay .c.sel{fill:rgba(154,98,18,.3)}
.lay.off{display:none}
/* Vilna margin sources on the daf page: a thin strip beside the scan (its own margins are full of
   print), one stack of dots per Gemara line with sources; the scan is white in dark mode too, so
   the colors are fixed. A tap lists the line's sources in the box under the page. */
.pgxr{position:absolute;top:0;bottom:0;right:0;width:var(--xrw,18px);border-left:1px solid #E4E6EC}
body.xr-off .pgxr{display:none}
.pgdots{position:absolute;inset:0 var(--xrw,18px) 0 0;pointer-events:none}
body.xr-off .pgdots{display:none}
/* in the gutter between the Gemara and the Rashi/Tosafot on its right, at the line's first printed row */
.pgdot{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;gap:calc(1px * var(--pz,1));padding:1px;cursor:pointer;border-radius:3px;pointer-events:auto}
.pgdot:hover,.pgdot.on{background:#C9D8F5}
.pgdot i{width:calc(5px * var(--pz,1));height:calc(5px * var(--pz,1));border-radius:50%;display:block;background:var(--k);box-shadow:0 0 0 1px #fff}
.pgdot .xc,.pagepop .xc{--k:#3A62A8}.pgdot .xc.ms,.pagepop .xc.ms{--k:#9A6212}.pgdot .xc.v,.pagepop .xc.v{--k:#6B4FA0}
/* Open (the default), the sources sit beside their lines in a panel over the page's outer margin, from
   where Rashi/Tosafot end to the dots, and move with the page; the arrow folds it to the dots (prefs.pgShut,
   the daf page's own, apart from the text's). Block tops and the width are set in px by pgFit. */
.pgmg{display:block;position:absolute;top:0;bottom:0;right:0;box-sizing:border-box;background:var(--panel);
 border-left:1px solid var(--line);box-shadow:-4px 0 12px rgba(20,30,60,.08);font:11.5px/1.35 var(--sans);text-align:left;cursor:auto}
.pgmg .pgm{position:absolute;left:6px;right:5px}
.pgmg .pgm+.pgm{}
.pgmg .xpl+.xpl{margin-top:4px}
.pgmg .pgm:hover,.pgmg .pgm.on{background:color-mix(in srgb,var(--blue) 6%,transparent);border-radius:3px}
body.pg-shut .pgmg,body.xr-off .pgmg{display:none!important}
/* the fold arrows ride at the top of the view: › on the panel, ‹ on the dots' strip */
.pgtog{position:sticky;top:4px;height:0;z-index:4}
.pgtog button{position:absolute;right:2px;top:0;width:22px;height:22px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--muted);font:600 14px/1 var(--sans);cursor:pointer;padding:0}
#pageXr .pgtog button{right:-3px;width:20px}
.pgtog button:hover{color:var(--blue);border-color:var(--blue)}
#pageXr .pgtog{display:none}body.pg-shut #pageXr .pgtog{display:block}
.pagebar .laynote{font-size:12px;color:var(--amber)}
.pagepop{position:relative;border:1px solid var(--line);border-radius:6px;background:var(--panel);box-shadow:var(--shadow);padding:10px 12px;padding-inline-end:34px;max-height:38%;overflow:auto;font-size:14px}
.pagepop .x{position:absolute;top:4px;inset-inline-end:6px;border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer;padding:2px 6px}
.pagepop .who{font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.pagepop .he{font:400 1.08rem/1.7 var(--hebrew);direction:rtl;text-align:right;margin:2px 0}
.pagepop .en{color:var(--muted);margin:4px 0 0}
.pagepop .en b{color:var(--ink);font-weight:600}
.pagepop .go{margin-top:8px}
.pagepop .he b{font-weight:700}
/* Size sliders at the foot of each side, as in AnyTorah web: the outline's also sizes the
   contents column; the text side's sizes the Gemara and shiur, and zooms the daf page. Text sizes
   use CSS zoom on the content, so the renderer's own proportions (headings, charts, pictures)
   scale together. */
.col{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
/* Drag handles on the outline column's two edges: one toward the text side, one toward the
   contents column. Double-click resets. */
.gutter{position:absolute;top:0;bottom:0;width:9px;z-index:4;cursor:col-resize;touch-action:none}
.gutter::after{content:"";position:absolute;top:0;bottom:0;left:4px;width:1px;background:transparent;transition:background .15s}
.gutter:hover::after,.gutter.drag::after{background:var(--blue);width:2px}
.g-gem{inset-inline-end:-5px}.g-rail{inset-inline-start:-5px}
.main.textleft .g-gem{inset-inline-end:auto;inset-inline-start:-5px}.main.textleft .g-rail{inset-inline-start:auto;inset-inline-end:-5px}
.g-rail{display:none}
.g-gem2{display:none}
/* Close Contents, at the top of the contents column, since its button is otherwise under Options */
.railtop{display:flex;justify-content:flex-end;margin:-6px 0 8px}
.railtop .btn{font-size:12px;padding:3px 10px;color:var(--muted)}
@media (min-width:1100px){.main.rail .g-rail{display:block}}
body.dragging{cursor:col-resize;user-select:none}
.col>.pane{flex:1}
.foot{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:6px 14px;border-top:1px solid var(--line);background:var(--panel);font-size:11px;color:var(--muted)}
.foot .fa{opacity:.6;line-height:1}
.foot .fa.sm{font-size:10px}.foot .fa.lg{font-size:14px}
.foot input{width:88px;accent-color:var(--blue)}
.foot .fl{min-width:4.6em;opacity:.8}
.zoomable{zoom:var(--fz,1)}
.page p{font-size:12.5px;color:var(--muted);margin:0;max-width:60ch}
.pick{font:400 15.5px/1.3 var(--sans);color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.pick.small{font:500 12.5px var(--sans);padding:5px 8px;border-radius:999px;max-width:14rem}
.nav{display:inline-flex;align-items:center;gap:4px}
.navb{font:500 1.35rem/1 var(--serif);width:32px;height:32px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);cursor:pointer;padding:0 0 3px}
.navb:disabled{opacity:.35;cursor:default}
.nooutline{padding:36px 4px;max-width:34rem}
.nooutline .t{font:600 1.3rem/1.3 var(--serif);margin:0 0 8px}
.nooutline p{color:var(--muted);margin:0 0 12px}
.bar .sub{font:500 12px var(--sans);color:var(--muted)}
.approx{display:block;font-size:12px;color:var(--amber);margin-top:2px}
.loading{padding:40px 28px;color:var(--muted)}
.credit{font-size:11.5px;color:var(--muted);padding:14px 8px 0}
.gwin{position:fixed;z-index:20;inset-inline-end:24px;top:84px;width:min(380px,calc(100vw - 32px));height:min(560px,calc(100% - 120px));background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;resize:both;overflow:hidden;min-width:260px;min-height:220px}
.gwin header{display:flex;align-items:center;gap:8px;padding:8px;padding-inline-start:14px;border-bottom:1px solid var(--line);cursor:move;user-select:none;touch-action:none}
.gwin header h2{font:600 13px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0;flex:1}
.gwin header button{font:500 18px/1 var(--sans);border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:6px;cursor:pointer}
.gwin header button:hover{background:var(--grey-soft)}
.gwin .search{padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gwin .search input{flex:1 1 160px}
.gwin input{width:100%;box-sizing:border-box;font:14px var(--sans);padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--ground);color:var(--ink)}
.gwin .glist{overflow-y:auto;padding:0 14px 14px;flex:1}
/* sages pop-out */
#swin{width:min(560px,calc(100vw - 32px));height:min(640px,calc(100% - 120px));inset-inline-end:48px;top:108px}
.swtools{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.slist{overflow-y:auto;flex:1;padding:0 14px 14px}
/* the timeline stays put above the cards, with its own scrolling */
.stl{flex:0 0 auto;max-height:42%;overflow:auto;padding:8px 0 6px;padding-inline-end:14px;border-bottom:1px solid var(--line);position:relative}
.stl:empty,.stl:empty+.sgrip{display:none}
.stl.sized{max-height:none}
.sgrip{flex:0 0 auto;height:9px;cursor:row-resize;touch-action:none;position:relative;margin-top:-5px;z-index:1}
.sgrip::after{content:"";position:absolute;left:50%;top:3px;width:36px;height:3px;margin-left:-18px;border-radius:2px;background:var(--line)}
.sgrip:hover::after,.sgrip.drag::after{background:var(--blue)}
#swin.big{width:min(1180px,calc(100vw - 32px));height:calc(100% - 96px);inset-inline-start:16px;inset-inline-end:auto;top:80px}
#swin::after{content:"";position:absolute;inset-inline-end:3px;bottom:3px;width:10px;height:10px;border-inline-end:2px solid var(--line);border-bottom:2px solid var(--line);pointer-events:none}
.tlg button.on{background:var(--blue);color:var(--panel)}
/* the Eretz Yisrael / Bavel labels stay in view while the timeline scrolls sideways */
/* no padding on the scroller's left, so the pinned labels reach the panel's edge; the labels
   carry the indent themselves */
.tlg .rh,.tlg .corner{position:sticky;inset-inline-start:0;background:var(--panel);z-index:1;padding-inline-start:14px}
.tlnote{padding-inline-start:14px}
.tlnote{font-size:11px;color:var(--muted);margin:4px 0 0;position:sticky;inset-inline-start:0}
.tlg{display:grid;grid-template-columns:calc(5.2rem + 14px) repeat(14,minmax(58px,1fr));min-width:880px;font-size:11px}
.tlg>div{border-inline-start:1px solid var(--line);padding:3px 3px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.tlg .hd{font:600 10.5px var(--sans);color:var(--muted);letter-spacing:.04em;border-inline-start-color:transparent;padding-bottom:4px}
.tlg .hd.era{grid-column:span 6;border-inline-start:1px solid var(--line);text-transform:uppercase}
.tlg .hd.era.am{grid-column:span 8}
.tlg .rh{font:600 10.5px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-inline-start:0;justify-content:center}
.tlg .row2{border-top:1px dashed var(--line)}
.tlg button{font:500 11px/1.25 var(--sans);text-align:start;border:0;border-radius:4px;padding:1px 5px;background:var(--term);color:var(--ink);cursor:pointer;max-width:100%}
.tlg button.moved{background:var(--amber-soft)}
.tlg button:hover{outline:1px solid var(--blue)}
.sage{padding:12px 4px 14px;border-top:1px solid var(--line);scroll-margin-top:6px;border-radius:4px}
.sage:first-child{border-top:0}
.sage.hit{background:var(--term);padding-inline:10px}
.sage h3{margin:0;display:flex;justify-content:space-between;gap:12px;align-items:baseline;font:600 1.05rem/1.3 var(--serif);color:var(--blue)}
.sage h3 span{font:500 1.05rem var(--hebrew);color:var(--ink)}
.sage .meta{font-size:12.5px;color:var(--muted);margin:2px 0 0}
.sage .meta b{font-weight:600;color:var(--ink)}
.sage .guess{font-size:12px;color:var(--amber);margin:3px 0 0}
.sage .row{display:flex;flex-wrap:wrap;gap:5px;align-items:baseline;margin-top:7px;font-size:12.5px}
.sage .row>span:first-child{font:600 10.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);min-width:4.8rem}
.sage .row button{font:500 12px var(--sans);text-align:start;border:0;border-radius:999px;padding:2px 9px;cursor:pointer;background:var(--grey-soft);color:var(--link)}
.sage .row .p{color:var(--muted);font-size:12px}
.sage details{margin-top:7px;font-size:13.5px}
.sage summary{font:500 12px var(--sans);color:var(--link);cursor:pointer}
.sage details p{margin:4px 0 0;max-width:62ch}
.sage .links{font-size:12px;margin-top:6px}.sage .links a{color:var(--link);margin-inline-end:12px}

/* audio bar: the day's shiur, and the sides following it */
.abar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:7px 14px calc(7px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--audio-line);background:var(--audio-bg);font-size:12.5px;color:var(--muted)}
.abar .askip,.abar .seg{background:var(--panel)}
.listen{flex:none;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;margin:8px 14px;font:600 12.5px var(--sans);color:var(--blue);background:var(--audio-bg);border:1px solid var(--audio-line);border-radius:999px;padding:6px 14px;cursor:pointer}
.listen:hover{border-color:var(--blue)}
/* section pills, as in the apps: the shiur's sections in the audio panel and the Gemara window */
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px 0 2px;flex-basis:100%;min-width:0}
.pills::-webkit-scrollbar{display:none}
.pills{cursor:grab;user-select:none;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);padding-inline:6px}
.pills.drag,.pills.drag button{cursor:grabbing}
.pills button{flex:none;font:500 12px var(--sans);white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel);color:var(--ink);cursor:pointer}
.pills button.on{background:var(--blue);border-color:var(--blue);color:var(--panel)}
.pills button:disabled{opacity:.4;cursor:default}
.aplay{width:38px;height:38px;border-radius:50%;border:0;background:var(--blue);color:var(--panel);font-size:15px;cursor:pointer;flex:none}
.askip{font:600 12px var(--sans);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 9px;cursor:pointer;font-variant-numeric:tabular-nums}
.atime{font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
/* the scrubber is a strip across the top of the panel, so the controls and Follow fit on one row */
#aSeek{order:-1;flex:1 1 100%;margin:0;accent-color:var(--blue)}
/* "Follow" sits inside its own switch, divided from the two choices, so it reads as their label */
#aFollow{align-items:center}
.adiv{align-self:stretch;width:1px;margin:2px 4px;margin-inline-start:auto;background:var(--audio-line);flex:none}
.afl{font:600 10.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:0;padding-inline:8px 9px;margin-inline-end:0;align-self:stretch;display:inline-flex;align-items:center}
.anote{flex-basis:100%;font-size:12px;color:var(--amber)}
.anote:empty{display:none}
.anote a,.anote button{font:inherit;color:var(--link);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
/* the line being read, in every view: a teal edge, apart from the section's blue */
.item.aud{box-shadow:inset 4px 0 0 var(--teal);background:color-mix(in srgb,var(--teal) 10%,transparent)}
.quote.aud{border-inline-start-color:var(--teal);box-shadow:inset 3px 0 0 var(--teal)}
.lay .g.aud{fill:rgba(44,106,110,.28)}
.lay .audp{fill:none;stroke:#2C6A6E;stroke-width:1.5;stroke-linecap:square;vector-effect:non-scaling-stroke}
.text,.shiur{touch-action:manipulation}   /* taps are quick (no double-tap zoom delay) */
.pfh{font:600 11.5px var(--sans);border:1px solid var(--teal);color:var(--teal);background:var(--panel);border-radius:999px;padding:2px 10px;cursor:pointer;margin-top:6px}
.pl{font:500 11px var(--sans);color:var(--teal);background:none;border:1px solid var(--teal-line);border-radius:999px;padding:1px 8px;cursor:pointer;margin-inline-start:6px;vertical-align:middle}
.backaud{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);z-index:5;font:600 12.5px var(--sans);border:0;border-radius:999px;padding:8px 16px;background:var(--teal);color:#fff;box-shadow:var(--shadow);cursor:pointer}
.gem{position:relative}
/* resources pop-out */
#rwin{width:min(460px,calc(100vw - 32px));inset-inline-end:72px;top:96px}
.rlist{overflow-y:auto;flex:1;padding:4px 14px 14px}
.rlist h3,.rlist summary{font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.rlist summary{cursor:pointer}
.res{display:block;padding:10px 4px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.res:hover .rt{text-decoration:underline}
/* the piece's featured image, a square beside it (as in the apps), with a play mark on audio */
.res.haspic{display:flex;gap:12px;align-items:flex-start}
.res .rbody{display:block;min-width:0;flex:1}
.res .rimg{position:relative;flex:none;width:72px;height:72px;border-radius:8px;overflow:hidden;background:var(--grey-soft);margin-top:2px}
.res .rimg img{width:100%;height:100%;object-fit:cover;display:block}
.res .rplay{position:absolute;inset:auto 5px 5px auto;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.res .rt{font:600 1rem/1.3 var(--serif);color:var(--blue);margin:3px 0 0}
.res .rm{font-size:12px;color:var(--muted)}
.res .rx{font-size:13.5px;color:var(--muted);margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.res .rs{font:600 10.5px var(--sans);letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 8px;background:var(--grey-soft);color:var(--muted)}
.res .rs.audio{background:var(--amber-soft);color:var(--amber)}
.res .rd{font:500 11.5px var(--sans);color:var(--teal);margin-inline-start:6px}
.rlist .none{color:var(--muted);font-size:13.5px;margin:12px 0}
.outhead{margin:0 0 18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.outhead h1{margin:0;font:600 1.7rem/1.2 var(--serif);color:var(--blue)}
.outhead p{margin:8px 0 0;font:15px/1.55 var(--serif);color:var(--muted)}
.outhead p b{font-weight:600;color:var(--ink)}
.outhead .ado-foldbar{display:flex;gap:6px;margin:12px 0 0}
.outhead .ado-foldbar button{font:500 12px var(--sans);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 11px;border-radius:999px;cursor:pointer}
.outhead .ado-foldbar button:hover{border-color:var(--blue);color:var(--blue)}
html[lang="he"] .outhead h1,html[lang="he"] .outhead p{font-family:var(--hebrew)}
#resBtn .n{display:inline-block;min-width:18px;box-sizing:border-box;margin-inline-start:6px;padding:0 6px;border-radius:999px;background:var(--blue);color:var(--panel);font:600 11px/18px var(--sans);text-align:center;vertical-align:1px}
#resBtn[aria-pressed="true"] .n{background:var(--panel);color:var(--blue)}
/* "Outline" joins the Daf / Gemara / Shiur switch only on a phone, where one side shows at a time. */
.seg .ph{display:none}
/* On wide screens the options sit in the bar as they always did; on a phone they fold behind
   an Options button, leaving the daf picker and the view switch. */
/* Settings: a vertical panel dropping from the gear at the bar's end */
.bar{position:relative}
.more{display:none;position:absolute;top:calc(100% + 4px);inset-inline-end:12px;z-index:60;width:min(300px,calc(100vw - 24px));
 flex-direction:column;align-items:stretch;gap:14px;padding:12px 16px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:calc(100vh - 120px);overflow:auto}
.bar.open .more{display:flex}
.morehead{display:flex;align-items:center;justify-content:space-between}
.morehead .mt{font:600 1rem var(--serif);color:var(--ink)}
.more .grp{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.more .grp+.grp{padding-top:12px;border-top:1px solid var(--line)}
.gear{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;padding:0}
.gear:hover,.gear[aria-expanded="true"]{color:var(--blue);border-color:var(--blue)}
/* Resources and Quizzes & Games: the study tools, together, in light blue */
.tools{display:inline-flex;gap:6px}
.btn.tool{background:var(--audio-bg);border:1px solid color-mix(in srgb,var(--blue) 45%,transparent);color:var(--blue);font-weight:600}
.btn.tool:hover{border-color:var(--blue)}
.btn.tool[aria-pressed="true"]{background:var(--blue);color:var(--panel)}
.more .gl{font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* What to show: the outline, the text side, or both. On a phone only one at a time. */

// ---------- resources: the YCT Torah Library on this daf ----------
// The same lookup as the apps (ResourcesManager / YCTLibraryClient): find the tractate's term in
// each site's "reference" taxonomy, then its daf terms, then every post tagged with any of them,
// and group by distance from this daf. The sites allow reads from this page (CORS), so this runs
// in the reader's browser; one set of requests per tractate, kept for the visit.
const RES_SOURCES=[
 {id:'library',label:'Library',base:'https://library.yctorah.org/wp-json/wp/v2',rest:'posts',parent:1899,tractateLevel:false},
 {id:'psak',label:'Rosh Yeshiva Responds',base:'https://psak.yctorah.org/wp-json/wp/v2',rest:'posts',parent:null,tractateLevel:true},
 {id:'audio',label:'Audio',base:'https://library.yctorah.org/wp-json/wp/v2',rest:'audio',parent:1899,tractateLevel:true}];
// A podcast episode is named with its podcast: "Iggros Moshe A to Z - Episode 25: …". The library's
// series taxonomy is not in its API, but each post's classes carry it (series-iggros-moshe).
const SERIES={'iggros-moshe':'Iggros Moshe A to Z','pastoral-parsha':'Pastoral Parsha','parsha-in-progress':'Parsha in Progress'};
function seriesTitle(p,title){
 const sl=((p.class_list||[]).find(c=>/^series-/.test(c))||'').slice(7);if(!sl)return title;
 const name=SERIES[sl]||(/^(final )?episode\b/i.test(title)?sl.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase()):'');
 return name&&!title.toLowerCase().startsWith(name.toLowerCase())?`${name} - ${title}`:title}
// AnyDaf's tractate names where the library's differ (anyDafToYCT in the apps).
const YCT_NAME={'Eiruvin':'Eruvin','Ta’anit':'Taanit','Taanit':'Taanit','Hullin':'Chullin','Middos':'Middot','Beitzah':'Beitza','Zevachim':'Zevahim','Rosh Hashanah':'Rosh HaShanah','Shevuot':"Shevu'ot"};
const NON_ENGLISH=['-he','-fr','-sp','-ar','-ru','-de','-pt'];
const resCache={};
const textOf=h=>{const d=document.createElement('div');d.innerHTML=h||'';return (d.textContent||'').replace(/\s+/g,' ').trim()};
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
async function fetchSource(src,tractate){
 const name=YCT_NAME[tractate]||tractate;
 const terms=await getJSON(`${src.base}/reference?search=${encodeURIComponent(name)}&per_page=10${src.parent?`&parent=${src.parent}`:''}`);
 const t=terms.find(x=>String(x.name).toLowerCase()===name.toLowerCase());if(!t)return [];
 const kids=await getJSON(`${src.base}/reference?parent=${t.id}&per_page=100`);
 const termToDaf={};kids.forEach(k=>{const n=parseInt(String(k.name).split(' ').pop(),10);if(n)termToDaf[k.id]=n});
 if(src.tractateLevel)termToDaf[t.id]=0;
 const ids=Object.keys(termToDaf);if(!ids.length)return [];
 const out=[];
 for(let page=1;page<=5;page++){   // 100 a page; the apps stop at the first page
  let posts;try{posts=await getJSON(`${src.base}/${src.rest}?reference=${ids.join(',')}&per_page=100&page=${page}&_fields=id,title,excerpt,content,date,link,slug,reference,class_list,_links,_embedded&_embed=author,wp:featuredmedia`)}catch(e){if(page>1)break;throw e}
  for(const p of posts){if(NON_ENGLISH.some(s=>p.slug.endsWith(s)))continue;
   const dafs=[...new Set((p.reference||[]).map(id=>termToDaf[id]).filter(d=>d!=null))];
   const specific=dafs.filter(d=>d).sort((a,b)=>a-b);
   const content=(p.content||{}).rendered||'',isAudio=/<audio/i.test(content)||src.id==='audio';
   let ex=textOf((p.excerpt||{}).rendered).replace(/\s*(Continue Reading|Read More)\s*[»›…]*\s*$/i,'');
   if(!ex&&content){const full=textOf(content.replace(/<div class="powerpress_player"[\s\S]*?<\/div>/g,'').replace(/<p class="powerpress_links[\s\S]*?<\/p>/g,''));ex=full.length>200?full.slice(0,200).trim()+'…':full}
   if(src.id==='psak')ex=ex.replace(/^QUE[ST]{2}ION\s+[^,]{1,40},\s*[A-Z]{2}\s+/i,'');
   const au=((p._embedded||{}).author||[])[0];
   // the post's featured image, as the apps show it (medium size, else thumbnail, else the original)
   const fm=((p._embedded||{})['wp:featuredmedia']||[])[0],sz=fm&&(fm.media_details||{}).sizes||{};
   const img=fm&&!fm.code?((sz.medium||sz.thumbnail||{}).source_url||fm.source_url||''):'';
   out.push({id:src.id+p.id,title:seriesTitle(p,textOf(p.title.rendered)),excerpt:ex,link:p.link,date:p.date,author:au&&au.name||'',img,
    source:src,isAudio,daf:specific[0]||0,dafs:specific})}
  if(posts.length<100)break}
 return out}
function loadResources(tractate){
 if(!resCache[tractate])resCache[tractate]=Promise.all(RES_SOURCES.map(s=>fetchSource(s,tractate).catch(()=>null)))
  .then(lists=>{const seen=new Map();   // one entry per title across sources, the newest kept
   lists.flat().filter(Boolean).forEach(a=>{const k=a.title.toLowerCase().trim(),o=seen.get(k);
    if(!o){seen.set(k,a);return}const dafs=[...new Set([...o.dafs,...a.dafs])].sort((x,y)=>x-y);
    const keep=a.date>o.date?a:o;keep.dafs=dafs;keep.daf=keep.daf||dafs[0]||0;seen.set(k,keep)});
   return {items:[...seen.values()],failed:lists.filter(l=>l===null).length}});

const dafNumOf=d=>parseInt((String(d.title).match(/\d+/)||['0'])[0],10);
async function showResources(){if(!D)return;const d=D,daf=dafNumOf(d);

 const card=a=>{const where=a.dafs.length?`${trName} ${a.dafs.slice(0,4).map(num).join(', ')}${a.dafs.length>4?'…':''}`:tr('{0}, general',trName);

  return `<a class="res${a.img?' haspic':''}" href="${esc(a.link)}" target="_blank" rel="noopener">${pic}<span class="rbody"><span class="rs${a.isAudio?' audio':''}">${a.isAudio?'🎧 ':''}${esc(tr(a.isAudio&&a.source.id!=='audio'?'Audio':a.source.label))}</span><span class="rd">${esc(where)}</span>
   <p class="rt" lang="en" dir="auto">${esc(a.title)}</p><p class="rm">${esc([RTL&&AUTHOR_HE[a.author]||a.author,date(a.date)].filter(Boolean).join(' · '))}</p>${a.excerpt?`<p class="rx" lang="en" dir="auto">${esc(a.excerpt)}</p>`:''}</span></a>`};
 L.innerHTML=(on.length?`<h3>${tr('On this daf')}</h3>${on.map(card).join('')}`:'')
  +(near.length?`<h3>${tr('Nearby dafim')}</h3>${near.map(card).join('')}`:'')
  +(rest.length?`<h3>${tr('Elsewhere in {0}',esc(trName))}</h3>${rest.map(card).join('')}`:'')
  +(r.failed?`<p class="none">${r.failed===3?tr("Couldn't reach the library. Check your connection and open Resources again."):tr("One of the library sites didn't answer, so this list may be incomplete.")}</p>`:'')

  +'&select=date,end_date,dedicated_by,honoree_name,period,preposition,occasion,display_text,photo_url&order=date.desc,id.desc&limit=10')}catch(e){return}
 const tier=p=>p==='week'?2:p==='month'?1:3;
 const r=(rows||[]).filter(x=>x.date&&x.dedicated_by).sort((a,b)=>tier(b.period)-tier(a.period))[0];if(!r)return;
 const per=r.period==='week'?'week':r.period==='month'?'month':'today';
 const msg=r.display_text||[`${{today:"Today's learning",week:"This week's learning",month:"This month's learning"}[per]} with the Illustrated Talmud is dedicated by ${r.dedicated_by}`,
  r.preposition,r.honoree_name,r.occasion].filter(Boolean).join(' ')+'.';
 $('dedLine').textContent=msg;$('dedLine').lang='en';$('dedLine').dir='auto';$('dedLine').hidden=false;
 let last=null;try{last=localStorage.getItem('anydaf:lastDedicationShown')}catch(e){}
 if(last===today)return;
 $('dedTitle').textContent=tr({today:"Today's Learning",week:"This Week's Learning",month:"This Month's Learning"}[per]);
 $('dedMsg').textContent=msg;$('dedPic').innerHTML='<div class="em" aria-hidden="true">📖</div>';
 // the photo bucket isn't readable at its plain public address: the authenticated one, with the key
 if(r.photo_url)fetch(r.photo_url.replace('/storage/v1/object/public/','/storage/v1/object/'),{headers:{apikey:READ.key,Authorization:'Bearer '+READ.key}})
  .then(x=>x.ok?x.blob():null).then(b=>{if(b){const i=new Image();i.alt='';i.src=URL.createObjectURL(b);$('dedPic').replaceChildren(i)}}).catch(()=>{});
 $('dedDlg').showModal();try{localStorage.setItem('anydaf:lastDedicationShown',today)}catch(e){}})();
$('dedClose').onclick=()=>$('dedDlg').close();
$('dedDlg').addEventListener('click',e=>{if(e.target===$('dedDlg'))$('dedDlg').close()});   // a click outside the box
</script>
