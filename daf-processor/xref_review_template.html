<title>Vilna Margin Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@400;500&display=swap">
<style>
/* Layout: the printed page on one side, its references line by line on the other, as a proofreader's desk. */
:root{
  --bg:#f3f4f1;--panel:#fff;--fg:#20262b;--mute:#5d6871;--line:#d9ddd8;--accent:#1b3a8a;
  --verse:#14705f;--verse-bg:#e2f3ee;--em:#8a3f12;--em-bg:#f9ebdf;--ms:#3a4aa8;--ms-bg:#e8eafa;
  --good:#17693c;--bad:#b02a2a;--good-bg:#e0f2e6;--bad-bg:#fae3e3;
  --sans:"Assistant","Helvetica Neue",Arial,sans-serif;--he:"Frank Ruhl Libre","Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171b20;--panel:#21262c;--fg:#e8ebee;--mute:#a1abb4;--line:#39424b;--accent:#9db4f2;
  --verse:#7fd8c3;--verse-bg:#17352f;--em:#f0b88e;--em-bg:#3a281b;--ms:#b0baf5;--ms-bg:#272c4d;
  --good:#7fd6a0;--bad:#f09a9a;--good-bg:#183325;--bad-bg:#3d2020;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171b20;--panel:#21262c;--fg:#e8ebee;--mute:#a1abb4;--line:#39424b;--accent:#9db4f2;
  --verse:#7fd8c3;--verse-bg:#17352f;--em:#f0b88e;--em-bg:#3a281b;--ms:#b0baf5;--ms-bg:#272c4d;
  --good:#7fd6a0;--bad:#f09a9a;--good-bg:#183325;--bad-bg:#3d2020;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{padding-block:14px 10px}
h1{font-size:20px;margin:0 0 2px}
header p{margin:0;color:var(--mute);max-width:80ch}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:8px;border-bottom:1px solid var(--line)}
.nav button{flex:none;font:600 13px var(--sans);padding:5px 10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;cursor:pointer;white-space:nowrap}
.nav button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.nav .done::after{content:" ✓";color:var(--good)}
.nav button[aria-current="true"].done::after{color:inherit}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.desk{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;padding-block:12px 40px;align-items:start}
.scanbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);height:calc(100vh - 72px);min-height:380px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.scanbar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mute)}
.scanbar button{font:600 13px var(--sans);padding:2px 9px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:5px;cursor:pointer}
.scan{flex:1;overflow:auto;background:#fff;cursor:grab}
.scan img{display:block;max-width:none;height:auto}
.head h2{font-size:22px;margin:0}
.head .why{color:var(--mute);margin:0 0 8px}
.count{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:12px;font-weight:700;padding:1px 7px;border-radius:4px}
.t-verse{background:var(--verse-bg);color:var(--verse)}.t-em{background:var(--em-bg);color:var(--em)}.t-ms{background:var(--ms-bg);color:var(--ms)}
.verdict{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px;display:grid;gap:8px}
.vrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.vrow>b{width:128px;font-size:13px}
.vrow button{font:600 12.5px var(--sans);padding:3px 9px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:5px;cursor:pointer}
.vrow button.on-ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.vrow button.on-no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
textarea{width:100%;min-height:58px;font:14px var(--sans);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--fg)}
.save{font-size:12.5px;color:var(--mute);min-height:18px}
.ln{border-top:1px solid var(--line);padding-block:8px}
.ln .gem{font:500 16px/1.5 var(--he);direction:rtl;text-align:right;display:flex;gap:8px;justify-content:space-between}
.ln .num{font:600 12px var(--sans);color:var(--mute);direction:ltr;flex:none}
.ref{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:baseline;padding-block:3px}
.ref .names{min-width:0}
.ref .h{font:400 15.5px var(--he);direction:rtl;unicode-bidi:plaintext}
.ref .e{font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}
.ref .x{font:600 11.5px var(--sans);padding:1px 7px;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:4px;cursor:pointer}
.ref.wrong .names{text-decoration:line-through}
.ref.wrong .x{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.empty{color:var(--mute);padding-block:10px}
@media (max-width:860px){.desk{grid-template-columns:minmax(0,1fr)}.scanbox{position:static;height:70vh}}
</style>

<header>
  <h1>Vilna Margin Check</h1>
  <p>Compare each amud's references with the printed margin. Mark any wrong reference, write in anything missing, and record a verdict for each kind. Answers save as you go.</p>
</header>
<nav class="nav" id="nav" aria-label="Amudim"></nav>
<main class="desk">
  <section class="scanbox" aria-label="Vilna page">
    <div class="scanbar"><span id="scanName"></span>
      <button id="zout" aria-label="Zoom out">−</button><button id="zin" aria-label="Zoom in">+</button><span>Drag to move</span></div>
    <div class="scan" id="scan"><img id="img" alt="Vilna page scan"></div>
  </section>
  <section id="side"></section>
</main>

<script>
const DATA = __DATA__;
const WORK = {rambam:"Rambam",smag:"Semag",tur:"Tur",sa:"Shulchan Arukh",other:"Other"};
const LAYERS = [["verse","Verses"],["em","Ein Mishpat"],["ms","Mesoret HaShas"]];
let db = null, cur = 0, zoom = 1;
const answers = {};
const blank = () => ({verse:null,em:null,ms:null,wrong:[],note:""});
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kindLabel = i => i.k==="verse" ? "Verse" : i.k==="em" ? WORK[i.work] : (i.cat==="Talmud" ? "Gemara" : i.cat);
const isDone = a => a && a.verse && a.em && a.ms;
function drawNav(){
  $("nav").innerHTML = DATA.map((d,i)=>`<button data-i="${i}" aria-current="${i===cur}" class="${isDone(answers[d.key])?"done":""}">${esc(d.title)}</button>`).join("");
}
function drawSide(){
  const d = DATA[cur], a = answers[d.key] || (answers[d.key]=blank());
  const all = d.rows.flatMap(r=>r.items), n = k=>all.filter(i=>i.k===k).length;
  $("side").innerHTML = `<div class="head"><h2>${esc(d.title)}</h2><p class="why">${esc(d.why)}</p></div>
  <div class="count"><span class="tag t-verse">${n("verse")} verses</span><span class="tag t-em">${n("em")} Ein Mishpat</span><span class="tag t-ms">${n("ms")} Mesoret HaShas</span></div>
  <div class="verdict">${LAYERS.map(([k,l])=>`<div class="vrow"><b>${l}</b>
    <button data-v="${k}" data-val="ok" class="${a[k]==="ok"?"on-ok":""}">Matches the print</button>
    <button data-v="${k}" data-val="missing" class="${a[k]==="missing"?"on-no":""}">Some missing</button>
    <button data-v="${k}" data-val="wrong" class="${a[k]==="wrong"?"on-no":""}">Some wrong</button>
    <button data-v="${k}" data-val="both" class="${a[k]==="both"?"on-no":""}">Both</button></div>`).join("")}
    <label for="note" class="save">What's missing or wrong</label>
    <textarea id="note" placeholder="For example: line 5, Shulchan Arukh Orach Chayim 329 is in the margin">${esc(a.note)}</textarea>
    <div class="save" id="saved"></div></div>
  ${d.rows.length ? d.rows.map(r=>`<div class="ln"><div class="gem"><span>${esc(r.text)}</span><span class="num">${r.n?("line "+r.n):"whole amud"}</span></div>
    ${r.items.map(i=>{const id=r.n+"|"+i.k+"|"+i.ref;return `<div class="ref ${a.wrong.includes(id)?"wrong":""}"><span class="tag t-${i.k}">${esc(kindLabel(i))}</span>
      <div class="names">${i.he?`<div class="h">${esc(i.he)}</div>`:""}<div class="e">${esc(i.ref)}${i.to?` (passage to ${esc(i.to)})`:""}</div></div>
      <button class="x" data-id="${esc(id)}">Wrong</button></div>`}).join("")}</div>`).join("") : `<p class="empty">No references on this amud.</p>`}`;
}
function show(i){
  cur=i; const d=DATA[i];
  $("img").src=`img/${d.key}.jpg`; $("scanName").textContent=d.title; $("scan").scrollTop=0;
  drawNav(); drawSide(); setZoom();
}
function setZoom(){ $("img").style.width=(zoom*100)+"%"; }
let timer=null;
async function save(key){
  const el=$("saved");
  try{ localStorage.setItem("xrefReview",JSON.stringify(answers)); }catch(e){}
  if(!db){ if(el) el.textContent="Saved in this browser only"; return; }
  try{ await db.doc("reviews/"+key).set({...answers[key],title:DATA.find(d=>d.key===key).title}); if(el) el.textContent="Saved"; }
  catch(e){ if(el) el.textContent="Couldn't save to the shared record. It's kept in this browser."; }
}
$("nav").addEventListener("click",e=>{const b=e.target.closest("button"); if(b) show(+b.dataset.i);});
$("side").addEventListener("click",e=>{
  const key=DATA[cur].key,a=answers[key];
  const v=e.target.closest("[data-v]"), x=e.target.closest("[data-id]");
  if(v){ a[v.dataset.v]=a[v.dataset.v]===v.dataset.val?null:v.dataset.val; const note=$("note").value; a.note=note; drawSide(); drawNav(); save(key); }
  if(x){ const id=x.dataset.id; a.wrong=a.wrong.includes(id)?a.wrong.filter(w=>w!==id):[...a.wrong,id]; a.note=$("note").value; drawSide(); save(key); }
});
$("side").addEventListener("input",e=>{ if(e.target.id!=="note") return; const key=DATA[cur].key; answers[key].note=e.target.value; clearTimeout(timer); timer=setTimeout(()=>save(key),600); });
$("zin").onclick=()=>{zoom=Math.min(3,zoom+.25);setZoom()};
$("zout").onclick=()=>{zoom=Math.max(.75,zoom-.25);setZoom()};
(()=>{const s=$("scan");let on=false,x,y,l,t;
  s.addEventListener("pointerdown",e=>{on=true;x=e.clientX;y=e.clientY;l=s.scrollLeft;t=s.scrollTop;s.setPointerCapture(e.pointerId);e.preventDefault()});
  s.addEventListener("pointermove",e=>{if(on){s.scrollLeft=l-(e.clientX-x);s.scrollTop=t-(e.clientY-y)}});
  s.addEventListener("pointerup",()=>on=false);s.addEventListener("pointercancel",()=>on=false);
})();
try{ Object.assign(answers,JSON.parse(localStorage.getItem("xrefReview")||"{}")); }catch(e){}
zoom=1.25; show(0);
(async()=>{
  if(!window.claude) return;
  db=await claude.use("db"); if(!db) return;
  for(const d of DATA){ try{ const s=await db.doc("reviews/"+d.key).get(); const v=s&&(typeof s.data==="function"?s.data():s.data??s); if(v&&v.wrong) answers[d.key]=v; }catch(e){} }
  drawNav(); drawSide();
})();
</script>
