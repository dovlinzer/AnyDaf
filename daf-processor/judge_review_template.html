<title>Margin Corrections Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@400;500&display=swap">
<style>
/* A proofreader's sheet: each card is one reference, the Gemara line above, the cited and suggested passages below. */
:root{
  --bg:#f3f4f1;--panel:#fff;--fg:#20262b;--mute:#5d6871;--line:#d9ddd8;--accent:#1b3a8a;
  --a:#8a3f12;--a-bg:#f9ebdf;--b:#14705f;--b-bg:#e2f3ee;
  --good:#17693c;--bad:#b02a2a;--good-bg:#e0f2e6;--bad-bg:#fae3e3;--pick:#fff6d6;
  --sans:"Assistant","Helvetica Neue",Arial,sans-serif;--he:"Frank Ruhl Libre","Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171b20;--panel:#21262c;--fg:#e8ebee;--mute:#a1abb4;--line:#39424b;--accent:#9db4f2;
  --a:#f0b88e;--a-bg:#3a281b;--b:#7fd8c3;--b-bg:#17352f;
  --good:#7fd6a0;--bad:#f09a9a;--good-bg:#183325;--bad-bg:#3d2020;--pick:#3a3520;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171b20;--panel:#21262c;--fg:#e8ebee;--mute:#a1abb4;--line:#39424b;--accent:#9db4f2;
  --a:#f0b88e;--a-bg:#3a281b;--b:#7fd8c3;--b-bg:#17352f;
  --good:#7fd6a0;--bad:#f09a9a;--good-bg:#183325;--bad-bg:#3d2020;--pick:#3a3520;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:1100px;margin:0 auto}
header{padding-block:14px 10px}
h1{font-size:20px;margin:0 0 4px}
header p{margin:0 0 4px;color:var(--mute);max-width:85ch}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:8px;border-bottom:1px solid var(--line)}
.nav button{flex:none;font:600 13px var(--sans);padding:5px 10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;cursor:pointer;white-space:nowrap}
.nav button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-block:12px;display:grid;gap:10px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.top h2{font-size:17px;margin:0}
.top .k{font-size:12.5px;color:var(--mute)}
.gem{display:grid;gap:4px}
.gem .he{font:500 17px/1.55 var(--he);direction:rtl;text-align:right}
.gem .en{font-size:13.5px;color:var(--mute)}
.gem .n{font:600 11.5px var(--sans);color:var(--mute)}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.src{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:6px;align-content:start}
.src.pick{background:var(--pick)}
.src .lab{font:700 12.5px var(--sans);display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.src .lab .t{padding:1px 7px;border-radius:4px}
.t-a{background:var(--a-bg);color:var(--a)}.t-b{background:var(--b-bg);color:var(--b)}
.src .lab .ref{font-weight:600;color:var(--fg);overflow-wrap:anywhere}
.src .txt{font:400 15.5px/1.55 var(--he);direction:rtl;text-align:right;max-height:15em;overflow:auto}
.judge{font-size:14px;border-left:3px solid var(--accent);padding-left:10px}
.judge b{font-weight:700}
.you{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.you>span{font:700 13px var(--sans);margin-right:4px}
.you button{font:600 13px var(--sans);padding:4px 11px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:5px;cursor:pointer}
.you button.on-ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.you button.on-no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.you button.on-q{background:var(--pick);border-color:var(--mute)}
textarea{width:100%;min-height:44px;font:14px var(--sans);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--fg)}
.save{font-size:12.5px;color:var(--mute);min-height:16px}
.tally{color:var(--mute);font-size:13.5px}
</style>

<main>
<header>
  <h1>Margin Corrections Check</h1>
  <p>A sample of the model's verdicts on Sefaria's margin references. For each card, say whether the model's call is right. If it is right on nearly all of them, its other verdicts can be accepted as they stand.</p>
  <p class="tally" id="tally"></p>
</header>
<nav class="nav" id="nav" aria-label="Groups"></nav>
<section id="list"></section>
</main>

<script>
const DATA = __DATA__;
const VERDICT = {B:"the reference is wrong; the suggested passage is right", A:"the cited passage is right",
  both:"both fit; the cited passage is acceptable", neither:"neither passage fits", unsure:"can't decide",
  unparsed:"no clear answer", yes:"the cited passage matches", partly:"related, but not clearly this line's ruling",
  no:"the cited passage doesn't match this line"};
const WORK = {rambam:"Rambam", sa:"Shulchan Arukh", tur:"Tur", smag:"Semag"};
const groups = [...new Set(DATA.map(d=>d.group))];
const answers = {};
let db = null, current = groups[0];
const docId = id => id.replace(/[^A-Za-z0-9_-]/g,"_");

function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"); }

function tally(){
  const done = DATA.filter(d=>answers[d.id]?.call).length;
  const wrong = DATA.filter(d=>answers[d.id]?.call==="wrong").length;
  document.getElementById("tally").textContent = `${done} of ${DATA.length} answered` + (done?`; you disagreed with the model on ${wrong}`:"");
  document.querySelectorAll(".nav button").forEach(b=>{
    const g = b.dataset.g, rows = DATA.filter(d=>d.group===g);
    b.textContent = `${g} (${rows.filter(d=>answers[d.id]?.call).length}/${rows.length})`;
  });
}

function nav(){
  const el = document.getElementById("nav"); el.innerHTML = "";
  for(const g of groups){
    const b = document.createElement("button"); b.dataset.g = g;
    b.setAttribute("aria-current", g===current); b.onclick = ()=>{ current = g; nav(); render(); scrollTo(0,0); };
    el.append(b);
  }
  tally();
}

function render(){
  const el = document.getElementById("list"); el.innerHTML = "";
  for(const d of DATA.filter(x=>x.group===current)){
    const c = document.createElement("article"); c.className = "card";
    const what = d.layer==="em" ? "Ein Mishpat, "+(WORK[d.work]||d.work) : d.layer==="verse" ? "Verse" : "Mesoret HaShas, "+d.layer.slice(3);
    const pickA = ["A","both","yes","partly"].includes(d.verdict), pickB = d.verdict==="B";
    c.innerHTML = `<div class="top"><h2>${esc(d.where)}</h2><span class="k">${esc(what)}</span></div>
      <div class="gem">${d.lines.map(l=>`<div class="n">${esc(l.n)}</div><div class="he">${esc(l.he)}</div><div class="en">${md(l.en)}</div>`).join("")}</div>
      <div class="pair">
        <div class="src${pickA?" pick":""}"><div class="lab"><span class="t t-a">${d.b?"A · cited":"Cited"}</span><span class="ref">${esc(d.a.ref)}</span></div><div class="txt">${esc(d.a.text)}</div></div>
        ${d.b?`<div class="src${pickB?" pick":""}"><div class="lab"><span class="t t-b">B · suggested</span><span class="ref">${esc(d.b.ref)}</span><span class="k">(${esc(d.b.how)})</span></div><div class="txt">${esc(d.b.text)}</div></div>`:""}
      </div>
      <div class="judge"><b>Model:</b> ${esc(VERDICT[d.verdict]||d.verdict)}. ${esc(d.reason)}</div>
      <div class="you"><span>The model is</span>
        <button data-v="right">Right</button><button data-v="wrong">Wrong</button><button data-v="unsure">Can't tell</button></div>
      <textarea placeholder="Note (optional): e.g. the right reference"></textarea><div class="save"></div>`;
    const a = answers[d.id]||{};
    const ta = c.querySelector("textarea"); ta.value = a.note||"";
    const paint = ()=>c.querySelectorAll(".you button").forEach(b=>{
      const v = (answers[d.id]||{}).call;
      b.className = b.dataset.v!==v ? "" : v==="right" ? "on-ok" : v==="wrong" ? "on-no" : "on-q"; });
    paint();
    c.querySelectorAll(".you button").forEach(b=>b.onclick = ()=>{
      answers[d.id] = {...(answers[d.id]||{}), call: b.dataset.v}; paint(); save(d, c); tally(); });
    let t; ta.oninput = ()=>{ clearTimeout(t); t = setTimeout(()=>{ answers[d.id] = {...(answers[d.id]||{}), note: ta.value}; save(d, c); }, 600); };
    el.append(c);
  }
}

async function save(d, card){
  const s = card.querySelector(".save");
  try{ localStorage.setItem("judgeReview", JSON.stringify(answers)); }catch(e){}
  if(!db){ s.textContent = "Saved in this browser"; return; }
  s.textContent = "Saving…";
  try{ await db.doc("judgments/"+docId(d.id)).set({...answers[d.id], where:d.where, ref:d.a.ref, alt:d.b?.ref||null,
        model:d.verdict, group:d.group}); s.textContent = "Saved"; }
  catch(e){ s.textContent = "Couldn't save online; kept in this browser"; }
}

try{ Object.assign(answers, JSON.parse(localStorage.getItem("judgeReview")||"{}")); }catch(e){}
nav(); render();
(async()=>{
  db = await claude.use("db"); if(!db) return;
  for(const d of DATA){
    try{ const s = await db.doc("judgments/"+docId(d.id)).get();
         const v = s && s.exists ? s.data() : null; if(v && v.call) answers[d.id] = {call:v.call, note:v.note||""}; }catch(e){}
  }
  nav(); render();
})();
</script>
