  <path d="M-20 18 Q-8 36 6 20 L4 12 Q-8 24 -19 12Z" fill="#8a8a8a"/>
  <circle cx="-4" cy="9" r="1.6" fill="#222"/>
  <path d="M-12 2 Q-8 -8 4 -4 L8 4 Q-4 0 -12 6Z" fill="#2c2c3c"/>
 </g>
