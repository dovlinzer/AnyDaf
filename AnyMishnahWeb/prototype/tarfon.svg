 <rect width="400" height="220" fill="url(#sky)"/>
 <g fill="#fff" opacity=".85"><circle cx="40" cy="30" r="1.5"/><circle cx="110" cy="18" r="1.5"/><circle cx="180" cy="40" r="1.5"/><circle cx="260" cy="22" r="1.5"/><circle cx="330" cy="45" r="1.5"/><circle cx="370" cy="15" r="1.5"/></g>
 <circle cx="320" cy="55" r="22" fill="#f6efc8"/><circle cx="311" cy="49" r="22" fill="#2a3a78"/>
 <path d="M0 150 Q120 130 400 160 L400 220 L0 220Z" fill="#2f3b2a"/>
 <path d="M-20 215 Q150 150 420 175 L420 220 L-20 220Z" fill="#a89268"/>
